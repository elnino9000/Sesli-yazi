name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Türkçe metin indir ve dil modeli üret
        run: |
          mkdir -p app/src/main/assets work
          timeout 300 curl -fsSL https://downloads.tatoeba.org/exports/per_language/tur/tur_sentences.tsv.bz2 \
            | bzcat | cut -f3 > work/tatoeba.txt || true
          timeout 600 curl -fsSL https://object.pouta.csc.fi/OPUS-OpenSubtitles/v2018/mono/tr.txt.gz \
            | gunzip -c | head -n 8000000 > work/subs.txt || true
          wc -l work/tatoeba.txt work/subs.txt || true
          cat work/tatoeba.txt work/subs.txt > work/corpus.txt 2>/dev/null || true
          if [ "$(wc -l < work/corpus.txt)" -gt 1000 ]; then
            python3 scripts/build_lm.py work/corpus.txt app/src/main/assets
          else
            echo "Metin indirilemedi, yedek sözlük kullanılıyor"
            curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/tr/tr_50k.txt \
              | awk '{print $1"\t"$2}' | grep -E '^[a-zçğıöşüâîû]{2,}\t' | head -n 35000 > app/src/main/assets/words_tr.txt || true
          fi
          ls -la app/src/main/assets || true

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Sesli-Yazi.apk

      - name: Son sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum Sesli-Yazi.apk \
            --target "$GITHUB_SHA" \
            --title "Sesli Yazı (son sürüm v${{ github.run_number }})" \
            --notes "Telefondan indirip kur: Sesli-Yazi.apk"
          gh release edit son-surum --draft=false --latest
