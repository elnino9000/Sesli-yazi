name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Türkçe metin indir ve dil modeli üret
        run: |
          mkdir -p app/src/main/assets work
          timeout 300 curl -fsSL https://downloads.tatoeba.org/exports/per_language/tur/tur_sentences.tsv.bz2 \
            | bzcat | cut -f3 > work/tatoeba.txt || true
          timeout 600 curl -fsSL https://object.pouta.csc.fi/OPUS-OpenSubtitles/v2018/mono/tr.txt.gz \
            | gunzip -c | head -n 20000000 > work/subs.txt || true
          : > work/extra.txt
          for u in OPUS-Wikipedia/v1.0 OPUS-wikimedia/v20230407 OPUS-Wikibooks/v1 OPUS-Wikiquote/v1 OPUS-WikiSource/v1 OPUS-bianet/v1 OPUS-TED2020/v1 OPUS-QED/v2.0a OPUS-Tanzil/v1 OPUS-GNOME/v1 OPUS-Ubuntu/v14.10 OPUS-bible-uedin/v1 OPUS-News-Commentary/v16 OPUS-Europarl/v8; do
            timeout 400 curl -fsSL "https://object.pouta.csc.fi/$u/mono/tr.txt.gz" | gunzip -c | head -n 4000000 > work/e1.txt || true
            echo "$u: $(wc -l < work/e1.txt) satır"
            cat work/e1.txt >> work/extra.txt
          done
          rm -f work/e1.txt
          timeout 900 curl -fsSL https://data.statmt.org/cc-100/tr.txt.xz | xz -dc | head -n 2500000 | awk 'length($0) > 15 && length($0) < 400' > work/cc.txt || true
          echo "cc-100: $(wc -l < work/cc.txt) satır"
          cat work/cc.txt >> work/extra.txt
          rm -f work/cc.txt
          wc -l work/tatoeba.txt work/subs.txt work/extra.txt || true
          tail -n 30000 work/subs.txt > work/test.txt || true
          head -n -30000 work/subs.txt > work/subs_train.txt || true
          cat work/tatoeba.txt work/extra.txt work/subs_train.txt > work/corpus.txt 2>/dev/null || true
          if [ "$(wc -l < work/corpus.txt)" -gt 1000 ]; then
            python3 scripts/build_lm.py work/corpus.txt app/src/main/assets work/test.txt
          else
            echo "Metin indirilemedi, yedek sözlük kullanılıyor"
            curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/tr/tr_50k.txt \
              | awk '{print $1"\t"$2}' | grep -E '^[a-zçğıöşüâîû]{2,}\t' | head -n 35000 > app/src/main/assets/words_tr.txt || true
          fi
          ls -la app/src/main/assets || true

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Lidya-Klavye.apk

      - name: Son sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum Lidya-Klavye.apk \
            --target "$GITHUB_SHA" \
            --title "Lidya Klavye (son sürüm v${{ github.run_number }})" \
            --notes "Telefondan indirip kur: Lidya-Klavye.apk"
          gh release edit son-surum --draft=false --latest
